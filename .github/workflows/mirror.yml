name: Mirror Upstream
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://github.com/andrewheiss/quarto-wordcount.git"
          source_branch: "main"
          destination_branch: "main"
          github_token: ${{ secrets.AUTOMATION_WORKFLOW_PAT }}
